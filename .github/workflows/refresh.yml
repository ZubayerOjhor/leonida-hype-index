name: Refresh data daily

# Pulls the latest attention, market and search data, re-runs the analysis and commits the new JSON.
# The commit triggers the Pages workflow, so the live dashboard stays current.
on:
  schedule:
    - cron: "30 22 * * 1-5"   # after the US close, Mon-Fri (22:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch.py
      - run: python scripts/analyze.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw dashboard/data
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push
